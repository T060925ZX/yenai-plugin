#白名单QQ
whiteQQ:
  - 123456

#黑名单QQ
blackQQ:
  - 123456

#白名单禁言自动解禁
noBan: false

# 投票禁言开关
VoteBan: true
# 投票踢人开关
VoteKick: false
# 投票禁言超时时间 单位：秒
outTime: 180
# 投票最低所需票数 不建议太低
minNum: 4
# 投票成功禁言时间 单位：秒
BanTime: 3600
# 是否允许管理员一票否决
veto: true
# 是否允许投票禁言管理员(Bot为群主的情况下)
voteAdmin: false

groupVerify:
  #开启的群聊
  openGroup:
    - 123456
  # 如需要分群，请按照下列格式添加 <以群号为字段> 的成功提示即可，0 字段代表默认回复
  SuccessMsgs:
    254974507: ✅ 验证成功，欢迎入群，群里有非常多的大佬给你透哦~~
    0: ✅ 验证成功，欢迎入群

  # 验证类型：math(数学计算) | email(邮箱验证码) | link(授权链接)
  verifyType: math
  
  # 答案验证模式，可选：精确、模糊（仅对数学计算模式有效）
  mode: 精确
  # 最多允许尝试次数
  times: 7
  # 超时时长（秒），建议至少一分钟（60 秒）。如果 >= 120 秒，将自动在最后一分钟提醒
  time: 300
  # 随机算式的数字的随机范围（仅对数学计算模式有效）
  range:
    min: 10
    max: 100
  #收到进群事件后延迟多少秒再发送验证信息(秒)
  DelayTime: 2
  
  # SMTP邮件服务配置
  smtpConfig:
    # SMTP服务器地址（QQ邮箱: smtp.qq.com, 163邮箱: smtp.163.com, Gmail: smtp.gmail.com）
    host: "smtp.qq.com"
    # SMTP端口（SSL端口通常为465或587）
    port: 465
    # 是否使用SSL连接
    secure: true
    # 发件人邮箱地址
    user: "your-email@qq.com"
    # 邮箱授权码（不是登录密码，需要在邮箱设置中获取）
    pass: "your-authorization-code"
    # 发件人显示名称
    fromName: "椰奶机器人"
  
  # 邮箱验证码配置
  emailVerify:
    # 验证码长度
    codeLength: 6
    # 最多允许尝试次数
    maxAttempts: 5
    # 邮件主题（支持变量：{groupId}, {groupName}）
    emailSubject: "入群验证码 - 请完成验证"
    # 邮件模板风格：gradient-purple(渐变紫色) | simple-blue(简约蓝色) | business-card(商务卡片) | dark-tech(暗色科技) | fresh-green(清新绿色) | custom(自定义)
    emailTemplateStyle: "gradient-purple"
    # 自定义模板文件名（当 emailTemplateStyle 为 "custom" 时生效，文件放在 config 目录下）
    customTemplateFile: "my-email-template.html"

groupAddNotice:
  openGroup:
    - 123465
  msg: 有一个加群通知，管理员快去看看吧~

# 撤回消息权限
# all: 所有人
# admin: 管理员 + 群主 + 主人
# owner: 群主 + 主人
# master: 主人
recallMsgPer:
  # 撤回bot消息
  bot: all
  # 撤回群员消息
  member: admin
